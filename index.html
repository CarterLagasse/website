    <style>
        :root {
            --vs-bg: #020617;

            --vs-bg-hover: #1e293b;
            --vs-bg-card: #1e293b;

            --vs-border-light: #334155;

            --vs-blue: #38bdf8;
            --vs-cyan: #22d3ee;
            --vs-green: #34d399;
            --vs-yellow: #fbbf24;

        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

            background: var(--vs-bg);

            padding: 48px 16px 40px;

        /* Professional terminal window */
        .vscode {

            border-radius: 12px;

        }

            height: 3px;
            background: #1e293b;
            flex-shrink: 0;
        }

        /* Terminal body */

            background: var(--vs-bg-panel);
            flex: 1;
        }

        .body {
            padding: 18px 20px 20px;
            min-height: 480px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            line-height: 1.5;
            font-variant-ligatures: none;

            flex-direction: column;
            gap: 0;
        }

        .block {
            margin: 0;
            padding: 0;
        }

        .line {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: baseline;
        }

        .prompt {
            color: var(--vs-text);
            font-weight: 400;
            white-space: nowrap;
            font-size: 13px;
        }

        .prompt .user { color: var(--vs-green); }
        .prompt .at { color: var(--vs-text); }
        .prompt .host { color: var(--vs-green); }
        .prompt .colon { color: var(--vs-text); }
        .prompt .path { color: var(--vs-blue); }
        .prompt .dollar { color: var(--vs-text); margin-left: 6px; }

        .cmd {
            color: var(--vs-text);
        }

        .output {

            flex-wrap: wrap;

        .markdown pre code { border: none; padding: 0; background: transparent; font-size: 12px; }

        .markdown blockquote { border-left: 2px solid #334155; padding-left: 10px; margin: 8px 0; color: #94a3b8; }

            .body { padding: 14px 14px 16px; font-size: 12.5px; }

            .panel-header { height: 36px; padding: 0 12px; }
            .panel-title { font-size: 11px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>

<script>
const FS = {
    "~": {
        "Carter-Lagasse/": {
            "connect/": {
                "github": { _link: "https://github.com/CarterLagasse", _desc: "github.com/CarterLagasse" },
                "linkedin": { _link: "https://www.linkedin.com/in/carter-lagasse/", _desc: "linkedin.com/in/carter-lagasse" },
                "email": { _link: "mailto:carter.lagasse@gmail.com", _desc: "carter.lagasse@gmail.com" }
            },
            "projects/": {
                "personal-website/": { _desc: "This terminal portfolio — interactive filesystem in the browser", _tags: ["HTML","CSS","JS"], _link: "https://github.com/CarterLagasse" },
                "project-atlas/": { _desc: "Placeholder — data visualization toolkit for large datasets", _tags: ["React","D3"], _link: "#" },
                "cli-utils/": { _desc: "Placeholder — collection of productivity CLI tools", _tags: ["Python","CLI"], _link: "#" }
            },
            "experience/": {},
            "README.md": "# Carter Lagasse — Terminal Website\n\nEverything is a file. Click anything blue.\n\n- `connect/` — GitHub, LinkedIn, email\n- `projects/` — live GitHub repos\n- `experience/` — work & education"
        }
    }
};

let cwd = ["~"];
let history = [];
let histIdx = -1;

const termBody = document.getElementById('termBody');

// auto-load GitHub repos into projects/ — live, no token, fallback to static placeholders
async function loadGitHubProjects() {
    const projectsPath = ["~", "Carter-Lagasse/", "projects/"];
    try {
        const res = await fetch("https://api.github.com/users/CarterLagasse/repos?per_page=100&sort=updated", {
            headers: { "Accept": "application/vnd.github+json" }
        });
        if (!res.ok) throw new Error(`GitHub ${res.status}`);
        const repos = await res.json();
        const filtered = repos
            .filter(r => !r.fork && !r.archived)
            .sort((a, b) => new Date(b.pushed_at || b.updated_at) - new Date(a.pushed_at || a.updated_at))
            .slice(0, 12);
        if (!filtered.length) return;
        const projects = {};
        for (const r of filtered) {
            const key = r.name + "/";
            const desc = r.description || (r.language ? `${r.language} project` : "GitHub repository");
            const tags = [...(r.topics || []).slice(0, 3), r.language].filter(Boolean).slice(0, 3);
            projects[key] = {
                _desc: desc,
                _tags: tags,
                _link: r.html_url,
                _stars: r.stargazers_count,
                _updated: r.updated_at,
                _branch: r.default_branch || "main",
                _treeLoaded: false,
                _treeLoading: false
            };
        }
        // replace live but keep local README.md so folder stays readable
        const node = getNode(projectsPath);
        if (node) {
            const keepReadme = node["README.md"];
            Object.keys(node).forEach(k => delete node[k]);
            if (keepReadme) node["README.md"] = keepReadme;
            Object.assign(node, projects);
            console.log(`[projects] loaded ${Object.keys(projects).length} repos from GitHub`);
        }
    } catch (e) {
        console.warn("[projects] GitHub fetch failed, keeping static placeholders", e);
    }
}
loadGitHubProjects();

function getNode(pathArr) {
    let node = FS;
    for (const p of pathArr) {
        if (node[p] === undefined) return null;
        node = node[p];
    }
    return node;
}

function cwdString() {
    if (cwd.length === 1) return "~";
    return "~/" + cwd.slice(1).join("");
}

function promptHTML() {
    const p = cwdString();
    return `<span class="prompt"><span class="user">carter</span><span class="at">@</span><span class="host">website</span><span class="colon">:</span><span class="path">${p}</span><span class="dollar">$</span></span>`;
}

function isDir(name) { return name.endsWith("/"); }
function isRepoPath(pathArr) {
    return pathArr.length === 4 && pathArr[2] === "projects/" && isDir(pathArr[3]);
}
function getRepoKey(pathArr) {
    if (pathArr.length >= 4 && pathArr[2] === "projects/") return pathArr[3];
    return null;
}
function isInRepo(pathArr) {
    return pathArr.length >= 4 && pathArr[2] === "projects/" && pathArr[3];
}

function renderLS(node) {
    const entries = Object.keys(node).filter(k => !k.startsWith("_"));
    if (entries.length === 0) {
        // if this is a repo node with only metadata, show card instead of empty
        if (node && node._desc) {
            return `<div class="output muted">empty — try <code>cat README.md</code> or <code>open</code> to view on GitHub</div>`;
        }
        return `<div class="output muted">empty</div>`;
    }
    let html = `<div class="ls">`;
    for (const name of entries) {
        const val = node[name];
        const cls = isDir(name) ? "dir" : (val && typeof val === "object" && val._link ? "link" : "file");
        html += `<a class="item ${cls}" data-name="${name}" tabindex="0">${name}</a>`;
    }
    html += `</div>`;
    return html;
}

function mdToHtml(md) {
    const codeBlocks = [];
    let s = md.replace(/```(?:\w+)?\n([\s\S]*?)```/g, (m, code) => {
        const idx = codeBlocks.length;
        codeBlocks.push(`<pre><code>${code.trim().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}</code></pre>`);
        return `@@CODEBLOCK${idx}@@`;
    });
    s = s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    const inlineCodes = [];
    s = s.replace(/`([^`]+?)`/g, (m, code) => {
        const idx = inlineCodes.length;
        inlineCodes.push(`<code>${code}</code>`);
        return `@@INLINE${idx}@@`;
    });
    const blocks = s.split(/\n{2,}/);
    const out = blocks.map(block => {
        let b = block.trim();
        if (!b) return "";
        if (/^@@CODEBLOCK\d+@@$/.test(b)) {
            const idx = parseInt(b.match(/\d+/)[0], 10);
            return codeBlocks[idx];
        }
        if (/^######\s+(.*)/.test(b)) return b.replace(/^######\s+(.*)/, '<h6>$1</h6>');
        if (/^#####\s+(.*)/.test(b)) return b.replace(/^#####\s+(.*)/, '<h5>$1</h5>');
        if (/^####\s+(.*)/.test(b)) return b.replace(/^####\s+(.*)/, '<h4>$1</h4>');
        if (/^###\s+(.*)/.test(b)) return b.replace(/^###\s+(.*)/, '<h3>$1</h3>');
        if (/^##\s+(.*)/.test(b)) return b.replace(/^##\s+(.*)/, '<h2>$1</h2>');
        if (/^#\s+(.*)/.test(b)) return b.replace(/^#\s+(.*)/, '<h1>$1</h1>');
        if (/^---\s*$/.test(b)) return '<hr>';
        if (/^>\s+/.test(b)) {
            const inner = b.replace(/^>\s+/gm, '').replace(/\n/g, ' ');
            return `<blockquote>${inner}</blockquote>`;
        }
        // table: header | separator | rows
        if (b.includes('|')) {
            const tLines = b.split('\n').filter(l => l.trim().length > 0);
            if (tLines.length >= 2 && tLines[0].includes('|') && /^\s*\|?(\s*:?-+:?\s*\|)+\s*:?-+:?\s*\|?\s*$/.test(tLines[1])) {
                const headerCells = tLines[0].split('|').map(c => c.trim()).filter(c => c.length > 0);
                let html = '<table><thead><tr>';
                headerCells.forEach(cell => {
                    let c = cell.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/__(.+?)__/g, '<strong>$1</strong>').replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/`([^`]+?)`/g, '<code>$1</code>');
                    c = c.replace(/@@INLINE\d+@@/g, (m) => { const idx = parseInt(m.match(/\d+/)[0], 10); return inlineCodes[idx]; });
                    html += `<th>${c}</th>`;
                });
                html += '</tr></thead><tbody>';
                for (let i = 2; i < tLines.length; i++) {
                    const rowCells = tLines[i].split('|').map(c => c.trim()).filter(c => c.length > 0);
                    if (!rowCells.length) continue;
                    html += '<tr>';
                    rowCells.forEach(cell => {
                        let c = cell.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/__(.+?)__/g, '<strong>$1</strong>').replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/`([^`]+?)`/g, '<code>$1</code>');
                        c = c.replace(/@@INLINE\d+@@/g, (m) => { const idx = parseInt(m.match(/\d+/)[0], 10); return inlineCodes[idx]; });
                        html += `<td>${c}</td>`;
                    });
                    html += '</tr>';
                }
                html += '</tbody></table>';
                return html;
            }
        }
        const lines = b.split(/\n/);
        const isList = lines.every(l => /^\s*([-*]|\d+\.)\s+/.test(l));
        if (isList) {
            const isOrdered = /^\s*\d+\./.test(lines[0]);
            const tag = isOrdered ? 'ol' : 'ul';
            const items = lines.map(l => l.replace(/^\s*(?:[-*]|\d+\.)\s+/, '').trim()).map(t => {
                let tt = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/__(.+?)__/g, '<strong>$1</strong>').replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
                tt = tt.replace(/@@INLINE\d+@@/g, (m) => {
                    const idx = parseInt(m.match(/\d+/)[0], 10);
                    return inlineCodes[idx];
                });
                return `<li>${tt}</li>`;
            }).join('');
            return `<${tag}>${items}</${tag}>`;
        }
        let q = b.replace(/\n/g, ' ');
        q = q.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        q = q.replace(/__(.+?)__/g, '<strong>$1</strong>');
        q = q.replace(/\*([^*\n]+?)\*/g, '<em>$1</em>');
        q = q.replace(/_([^_\n]+?)_/g, '<em>$1</em>');
        q = q.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
        q = q.replace(/@@INLINE\d+@@/g, (m) => {
            const idx = parseInt(m.match(/\d+/)[0], 10);
            return inlineCodes[idx];
        });
        return `<p>${q}</p>`;
    }).filter(Boolean);
    let html = out.join("\n");
    html = html.replace(/@@INLINE\d+@@/g, (m) => {
        const idx = parseInt(m.match(/\d+/)[0], 10);
        return inlineCodes[idx];
    });
    html = html.replace(/@@CODEBLOCK\d+@@/g, (m) => {
        const idx = parseInt(m.match(/\d+/)[0], 10);
        return codeBlocks[idx];
    });
    html = html.replace(/<h([1-6])>(.*?)<\/h\1>/g, (m, lvl, inner) => {
        let t = inner.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/__(.+?)__/g, '<strong>$1</strong>').replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
        t = t.replace(/@@INLINE\d+@@/g, (mm) => {
            const idx = parseInt(mm.match(/\d+/)[0], 10);
            return inlineCodes[idx];
        });
        return `<h${lvl}>${t}</h${lvl}>`;
    });
    return html;
}
function renderCat(name, nodeVal) {
    const isMd = name.toLowerCase().endsWith(".md") || name.toLowerCase().endsWith(".markdown");
    if (typeof nodeVal === "string") {
        if (isMd) {
            const html = mdToHtml(nodeVal);
            return `<div class="card markdown" style="max-height:60vh; overflow:auto;">${html}</div>`;
        }
        const esc = nodeVal.replace(/</g,"&lt;").replace(/>/g,"&gt;");
        return `<div class="card" style="white-space:pre-wrap; max-height:60vh; overflow:auto;">${esc}</div>`;
    }
    if (nodeVal && typeof nodeVal === "object" && nodeVal._desc) {
        let tags = "";
        if (nodeVal._tags) tags = `<div>${nodeVal._tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>`;
        let extra = "";
        if (nodeVal._stars !== undefined) extra += `<span class="tag">★ ${nodeVal._stars}</span>`;
        if (nodeVal._branch) extra += `<span class="tag">${nodeVal._branch}</span>`;
        let link = "";
        if (nodeVal._link && nodeVal._link !== "#") link = `<div style="margin-top:6px;"><a href="${nodeVal._link}" target="_blank" rel="noopener">↗ open ${name.replace('/','')}</a> <span style="color:var(--vs-faint); font-size:12px;">${nodeVal._link}</span></div>`;
        else if (nodeVal._link === "#") link = `<div style="margin-top:6px; color:var(--vs-faint); font-size:12.5px;">— coming soon</div>`;
        // if repo has children, hint
        const hasChildren = Object.keys(nodeVal).some(k => !k.startsWith("_"));
        const hint = hasChildren ? `<div style="margin-top:8px; color:var(--vs-dim); font-size:12px;">↳ <code>ls</code> to see files, <code>cat README.md</code> for readme</div>` : "";
        return `<div class="card">
            <div class="card-title">${name}</div>
            <p>${nodeVal._desc}</p>
            ${tags}${extra ? `<div>${extra}</div>` : ""}${link}${hint}
        </div>`;
    }
    return `<div class="output muted">no preview</div>`;
}

// --- GitHub tree / README for projects/<repo>/ (C with B fallback) ---
async function fetchRepoInfo(repo) {
    const r = repo.replace(/\/$/,'');
    const res = await fetch(`https://api.github.com/repos/CarterLagasse/${r}`, { headers: { "Accept": "application/vnd.github+json" }});
    if (!res.ok) throw new Error(`repo info ${res.status}`);
    return res.json();
}
async function ensureRepoTree(repoKey) {
    const projectsNode = getNode(["~","Carter-Lagasse/","projects/"]);
    if (!projectsNode || !projectsNode[repoKey]) return null;
    const repoNode = projectsNode[repoKey];
    if (repoNode._treeLoaded || repoNode._treeLoading) return repoNode;
    repoNode._treeLoading = true;
    try {
        const info = await fetchRepoInfo(repoKey);
        const branch = info.default_branch || "main";
        repoNode._branch = branch;
        // try recursive tree
        const treeRes = await fetch(`https://api.github.com/repos/CarterLagasse/${repoKey.replace(/\/$/,'')}/git/trees/${branch}?recursive=1`, { headers: { "Accept": "application/vnd.github+json" }});
        if (!treeRes.ok) throw new Error(`tree ${treeRes.status}`);
        const treeData = await treeRes.json();
        if (treeData.truncated) throw new Error("truncated");
        for (const entry of treeData.tree) {
            const parts = entry.path.split("/");
            let cur = repoNode;
            for (let i = 0; i < parts.length; i++) {
                const part = parts[i];
                const isLast = i === parts.length - 1;
                if (isLast) {
                    if (entry.type === "tree") {
                        const k = part + "/";
                        if (!cur[k]) cur[k] = {};
                    } else { // blob
                        if (cur[part] === undefined) cur[part] = ""; // placeholder, lazy load on cat
                    }
                } else {
                    const k = part + "/";
                    if (!cur[k]) cur[k] = {};
                    cur = cur[k];
                }
            }
        }
        repoNode._treeLoaded = true;
        console.log(`[tree] ${repoKey} loaded ${treeData.tree.length} entries via recursive`);
        return repoNode;
    } catch (e) {
        console.warn(`[tree] ${repoKey} recursive failed, falling back to shallow`, e);
        try {
            const r = repoKey.replace(/\/$/,'');
            const branch = getNode(["~","Carter-Lagasse/","projects/"])[repoKey]._branch || "main";
            const res = await fetch(`https://api.github.com/repos/CarterLagasse/${r}/contents?ref=${branch}`, { headers: { "Accept": "application/vnd.github+json" }});
            if (!res.ok) throw new Error(`contents ${res.status}`);
            const list = await res.json();
            if (Array.isArray(list)) {
                for (const item of list) {
                    if (item.type === "dir") {
                        const k = item.name + "/";
                        if (!repoNode[k]) repoNode[k] = {};
                    } else if (item.type === "file") {
                        if (repoNode[item.name] === undefined) repoNode[item.name] = "";
                    }
                }
                repoNode._treeLoaded = true; // shallow, will lazy load subdirs on cd
                repoNode._shallow = true;
                return repoNode;
            }
        } catch (e2) {
            console.warn(`[tree] ${repoKey} shallow also failed, will use link fallback`, e2);
        }
        // B fallback: keep as leaf with link, mark loaded to avoid retry loop
        repoNode._treeLoaded = true;
        repoNode._treeFailed = true;
        return repoNode;
    } finally {
        repoNode._treeLoading = false;
    }
}
async function ensureFileContent(repoKey, filePath, branch) {
    const r = repoKey.replace(/\/$/,'');
    const b = branch || "main";
    // try raw first (no auth, CORS ok)
    try {
        const rawUrl = `https://raw.githubusercontent.com/CarterLagasse/${r}/${b}/${filePath}`;
        const res = await fetch(rawUrl);
        if (!res.ok) throw new Error(`raw ${res.status}`);
        const text = await res.text();
        // basic binary guard: if contains null byte or too large, treat as binary
        if (text.length > 200000) return text.slice(0,200000) + "\n\n… truncated (200k)";
        if (text.includes("\u0000")) return `[binary file: ${filePath} — open on GitHub]`;
        return text;
    } catch (e) {
        // fallback to API contents
        try {
            const apiUrl = `https://api.github.com/repos/CarterLagasse/${r}/contents/${encodeURIComponent(filePath)}?ref=${b}`;
            const res = await fetch(apiUrl, { headers: { "Accept": "application/vnd.github+json" }});
            if (!res.ok) throw new Error(`api ${res.status}`);
            const data = await res.json();
            if (data.content && data.encoding === "base64") {
                const decoded = atob(data.content.replace(/\n/g,''));
                // try utf-8
                try { return decodeURIComponent(escape(decoded)); } catch { return decoded; }
            }
            return `[cannot decode ${filePath}]`;
        } catch (e2) {
            throw e2;
        }
    }
}
async function ensureShallowDir(pathArr) {
    // if we are in a repo subdir that was shallow-loaded, fetch its contents on demand
    const repoKey = getRepoKey(pathArr);
    if (!repoKey) return;
    const repoNode = getNode(["~","Carter-Lagasse/","projects/", repoKey]);
    if (!repoNode || !repoNode._shallow) return;
    const subPath = pathArr.slice(4).join("").replace(/\/$/,''); // after repo/
    if (!subPath) return; // root already shallow
    const node = getNode(pathArr);
    if (!node || Object.keys(node).some(k => !k.startsWith("_"))) return; // already has children
    try {
        const branch = repoNode._branch || "main";
        const r = repoKey.replace(/\/$/,'');
        const url = `https://api.github.com/repos/CarterLagasse/${r}/contents/${encodeURIComponent(subPath)}?ref=${branch}`;
        const res = await fetch(url, { headers: { "Accept": "application/vnd.github+json" }});
        if (!res.ok) throw new Error(`shallow dir ${res.status}`);
        const list = await res.json();
        if (Array.isArray(list)) {
            for (const item of list) {
                if (item.type === "dir") {
                    const k = item.name + "/";
                    if (!node[k]) node[k] = {};
                } else {
                    if (node[item.name] === undefined) node[item.name] = "";
                }
            }
        }
    } catch (e) {
        console.warn("[shallow dir] failed", subPath, e);
    }
}

function addBlock(cmdText, outputHTML, withPrompt=true, customPrompt=null) {
    const div = document.createElement('div');
    div.className = 'block';
    const prompt = customPrompt || promptHTML();
    div.innerHTML = `
        ${withPrompt ? `<div class="line">${prompt} <span class="cmd">${cmdText}</span></div>` : ``}
        ${outputHTML ? `<div class="output">${outputHTML}</div>` : ``}
    `;
    const inputLine = document.getElementById('inputLine');
    termBody.insertBefore(div, inputLine);
    bindClicks(div);
    scrollToBottom();
}

function scrollToBottom() {
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

function bindClicks(root) {
    root.querySelectorAll('.item').forEach(el => {
        el.addEventListener('click', (e) => {
            e.preventDefault();
            const name = el.dataset.name;
            const node = getNode(cwd);
            const val = node ? node[name] : null;
            if (val && val._link && !isDir(name)) {
                execCommand(`open "${name}"`);
            } else if (isDir(name)) {
                execCommand(`cd ${name}`);
            } else {
                execCommand(`cat "${name}"`);
            }
        });
        el.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') el.click();
        });
    });
}

function execCommand(raw) {
    const input = raw.trim();
    if (!input) return;
    history.push(input);
    histIdx = history.length;

    const promptBefore = promptHTML();
    const [cmd, ...args] = splitArgs(input);
    let out = "";
    let hasOutput = true;

    switch(cmd) {
        case "help":
            out = `<div class="help-grid">
                <dt>ls</dt><dd>list directory contents</dd>
                <dt>cd &lt;dir&gt;</dt><dd>change directory — e.g. <code>cd connect</code>, <code>cd ..</code></dd>
                <dt>cat &lt;file&gt;</dt><dd>view file — e.g. <code>cat README.md</code></dd>
                <dt>open &lt;name&gt;</dt><dd>open link — e.g. <code>open github</code></dd>
                <dt>pwd</dt><dd>print working directory</dd>
                <dt>clear</dt><dd>clear terminal</dd>
                <dt>whoami</dt><dd>about carter</dd>
            </div>`;
            break;
        case "ls":
        case "dir":
            {
                const node = getNode(cwd);
                if (!node) { out = `<span style="color:var(--vs-red)">ls: cannot access '${cwdString()}': No such file or directory</span>`; break; }
                const repoKey = getRepoKey(cwd);
                const repoNode = repoKey ? getNode(["~","Carter-Lagasse/","projects/", repoKey]) : null;
                // C: if inside a repo and tree not yet loaded, fetch it
                if (repoKey && repoNode && !repoNode._treeLoaded && !repoNode._treeLoading) {
                    out = `<span style="color:var(--vs-dim)">loading <code>${repoKey}</code> from GitHub…</span>`;
                    addBlock(escapeHtml(input), out, true, promptBefore);
                    document.getElementById('cmdInput').value = "";
                    updatePrompt(); updateHeader();
                    ensureRepoTree(repoKey).then(() => {
                        ensureShallowDir(cwd).then(() => {
                            const fresh = getNode(cwd);
                            addBlock("ls", renderLS(fresh), true, promptHTML());
                        });
                    });
                    return;
                }
                if (repoNode && repoNode._shallow) {
                    const cur = getNode(cwd);
                    const hasReal = cur && Object.keys(cur).some(k => !k.startsWith("_"));
                    if (!hasReal) {
                        out = `<span style="color:var(--vs-dim)">loading ${cwdString()}…</span>`;
                        addBlock(escapeHtml(input), out, true, promptBefore);
                        document.getElementById('cmdInput').value = "";
                        updatePrompt(); updateHeader();
                        ensureShallowDir(cwd).then(() => {
                            const fresh = getNode(cwd);
                            addBlock("ls", renderLS(fresh), true, promptHTML());
                        });
                        return;
                    }
                }
                out = renderLS(node);
                if (out.includes("empty") && node && node._desc && node._link) {
                    out = renderCat(cwd[cwd.length-1] || "repo", node) + `<div style="margin-top:8px">${renderLS(node)}</div>`;
                }
            }
            break;
        case "pwd":
            out = cwdString();
            break;
        case "whoami":
            out = `<div class="card"><div class="card-title">Carter Lagasse</div><p>Software developer · builder · terminal enthusiast<br>Use <code>ls</code> and <code>cd connect</code> to get in touch.</p></div>`;
            break;
        case "clear":
            termBody.querySelectorAll('.block').forEach(b => b.remove());
            document.getElementById('cmdInput').value = "";
            return;
        case "cd":
            {
                let target = (args[0] || "").replace(/^["']|["']$/g, "");
                if (!target || target === "~" || target === "~/") {
                    cwd = ["~"];
                    hasOutput = false;
                } else if (target === ".." || target === "../") {
                    if (cwd.length > 1) cwd.pop();
                    hasOutput = false;
                } else if (target === "." || target === "./") {
                    hasOutput = false;
                } else {
                    let tryName = target;
                    if (!tryName.endsWith("/")) tryName += "/";
                    const node = getNode(cwd);
                    if (node[tryName] && isDir(tryName)) {
                        cwd.push(tryName);
                        hasOutput = false;
                        // C: if entering a repo, kick off background tree load (no output, B fallback if fails)
                        const newRepoKey = getRepoKey(cwd);
                        if (newRepoKey) ensureRepoTree(newRepoKey);
                        else if (isInRepo(cwd)) ensureShallowDir(cwd);
                    } else if (node[target] && isDir(target)) {
                        cwd.push(target);
                        hasOutput = false;
                        const newRepoKey = getRepoKey(cwd);
                        if (newRepoKey) ensureRepoTree(newRepoKey);
                    } else {
                        const absNode = getNode(["~", "Carter-Lagasse/"]);
                        if (absNode[tryName]) {
                            cwd = ["~", "Carter-Lagasse/", tryName];
                            hasOutput = false;
                            const newRepoKey = getRepoKey(cwd);
                            if (newRepoKey) ensureRepoTree(newRepoKey);
                        } else {
                            out = `<span style="color:var(--vs-red)">bash: cd: ${target}: No such file or directory</span>`;
                            hasOutput = true;
                        }
                    }
                }
                if (!hasOutput) {
                    out = "";
                }
            }
            break;
        case "cat":
            {
                let target = args.join(" ").replace(/^["']|["']$/g, "");
                if (!target) { out = `<span style="color:var(--vs-red)">cat: missing operand</span>`; break; }
                const node = getNode(cwd);
                if (!node) { out = `<span style="color:var(--vs-red)">cat: ${target}: No such file or directory</span>`; break; }
                let val = node[target];
                if (val === undefined) {
                    const found = Object.keys(node).find(k => k.toLowerCase() === target.toLowerCase());
                    if (found) { target = found; val = node[found]; }
                }
                // C: if inside repo and file is placeholder "" or missing but exists in GitHub, fetch it
                const repoKey = getRepoKey(cwd);
                if (repoKey && (val === "" || val === undefined)) {
                    // check if we should try to fetch (only if target looks like file)
                    const maybeFile = !isDir(target) && target.includes(".");
                    // also if val === undefined but tree not loaded, ensure tree first
                    const repoNode = getNode(["~","Carter-Lagasse/","projects/", repoKey]);
                    const branch = repoNode ? repoNode._branch || "main" : "main";
                    const base = cwd.slice(4).join("");
                    const fullPath = (base + target).replace(/^\/+/, "");
                    // if val === "" we know it's a file placeholder; if val === undefined but tree not loaded, we still try fetch
                    if (val === "" || (val === undefined && maybeFile)) {
                        out = `<span style="color:var(--vs-dim)">fetching <code>${fullPath}</code> from GitHub…</span>`;
                        addBlock(escapeHtml(input), out, true, promptBefore);
                        document.getElementById('cmdInput').value = "";
                        updatePrompt(); updateHeader();
                        (async () => {
                            try {
                                // ensure tree if needed for path existence check (optional)
                                if (repoNode && !repoNode._treeLoaded) await ensureRepoTree(repoKey);
                                const text = await ensureFileContent(repoKey, fullPath, branch);
                                // cache
                                const cur = getNode(cwd);
                                if (cur) cur[target] = text;
                                addBlock(`cat "${target}"`, renderCat(target, text), true, promptHTML());
                            } catch (e) {
                                const link = repoNode ? repoNode._link : `https://github.com/CarterLagasse/${repoKey.replace(/\/$/,'')}`;
                                addBlock(`cat "${target}"`, `<span style="color:var(--vs-red)">cat: ${target}: ${e.message}</span><br><span style="color:var(--vs-dim)">↗ <a href="${link}/blob/${branch}/${fullPath}" target="_blank" style="color:var(--vs-cyan)">open on GitHub</a> — or <code>open ${repoKey.replace(/\/$/,'')}</code></span>`, true, promptHTML());
                            }
                        })();
                        return;
                    }
                }
                if (val === undefined) {
                    out = `<span style="color:var(--vs-red)">cat: ${target}: No such file or directory</span>`;
                } else if (isDir(target)) {
                    out = `<span style="color:var(--vs-red)">cat: ${target}: Is a directory</span>`;
                } else {
                    out = renderCat(target, val);
                }
            }
            break;
        case "open":
        case "xdg-open":
            {
                let target = (args[0] || "").replace(/^["']|["']$/g, "").replace(/\/$/, "");
                if (!target) { out = `<span style="color:var(--vs-red)">open: missing operand</span>`; break; }
                const node = getNode(cwd);
                let foundKey = Object.keys(node).find(k => k.replace(/\/$/,'').toLowerCase() === target.toLowerCase());
                let val = foundKey ? node[foundKey] : null;
                if (!val) {
                    const conn = getNode(["~","Carter-Lagasse/","connect/"]);
                    foundKey = Object.keys(conn).find(k => k.replace(/\/$/,'').toLowerCase() === target.toLowerCase());
                    if (foundKey) val = conn[foundKey];
                }
                if (val && val._link && val._link !== "#") {
                    window.open(val._link, "_blank");
                    out = `opening <span style="color:var(--vs-cyan)">${val._link}</span> ...`;
                } else if (val && val._link === "#") {
                    out = `<span style="color:var(--vs-yellow)">coming soon — ${target}</span>`;
                } else {
                    out = `<span style="color:var(--vs-red)">open: ${target}: not found</span>`;
                }
            }
            break;
        case "github":
        case "linkedin":
            window.open(cmd === "github" ? "https://github.com/CarterLagasse" : "https://www.linkedin.com/in/carter-lagasse/", "_blank");
            out = `opening ${cmd} ...`;
            break;
        default:
            out = `<span style="color:var(--vs-red)">bash: ${cmd}: command not found</span>`;
    }

    if (!hasOutput && out === "") {
        addBlock(escapeHtml(input), "", true, promptBefore);
        document.getElementById('cmdInput').value = "";
        updatePrompt();
        updateHeader();
        return;
    }

    addBlock(escapeHtml(input), out, true, promptBefore);
    document.getElementById('cmdInput').value = "";
    updatePrompt();
    updateHeader();
}

function splitArgs(str) {
    const re = /[^\s"']+|"([^"]*)"|'([^']*)'/g;
    const out = [];
    let m;
    while ((m = re.exec(str)) !== null) {
        out.push(m[1] || m[2] || m[0]);
    }
    return out;
}

function escapeHtml(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function updatePrompt() {
    const p = document.querySelector('#inputLine .prompt');
    if (p) p.innerHTML = `<span class="user">carter</span><span class="at">@</span><span class="host">website</span><span class="colon">:</span><span class="path">${cwdString()}</span><span class="dollar">$</span>`;
}
function updateHeader() {}

function initDemo() {
    const sequence = [
        "cd Carter-Lagasse",
        "cat README.md",
        "cd connect",
        "ls"
    ];

    cwd = ["~"];
    termBody.innerHTML = `
        <div class="ascii">  ____           _              _
 / ___|__ _ _ __| |_ ___ _ __  | |    __ _  __ _  __ _ ___ ___  ___
| |   / _\` | '__| __/ _ \\ '__| | |   / _\` |/ _\` |/ _\` / __/ __|/ _ \\
| |__| (_| | |  | ||  __/ |    | |__| (_| | (_| | (_| \\__ \\__ \\  __/
 \\____\\__,_|_|   \\__\\___|_|    |_____\\__,_|\\__, |\\__,_|___/___/\\___|
                                           |___/</div>
        <div class="input-line" id="inputLine">
            <span class="prompt">${promptHTML()}</span>
            <input id="cmdInput" autocomplete="off" spellcheck="false" disabled>
        </div>
    `;
    const input = document.getElementById('cmdInput');
    input.disabled = true;

    let idx = 0;

    function typeAtPrompt(text, speed, cb) {
        const inp = document.getElementById('cmdInput');
        inp.disabled = false;
        inp.value = "";
        inp.focus();
        let i = 0;
        const iv = setInterval(() => {
            inp.value = text.slice(0, ++i);
            try { inp.setSelectionRange(i, i); } catch {}
            if (i >= text.length) {
                clearInterval(iv);
                setTimeout(cb, 260);
            }
        }, speed);
    }

    function next() {
        if (idx >= sequence.length) {
            const finalInput = document.getElementById('cmdInput');
            finalInput.disabled = false;
            finalInput.value = "";
            finalInput.focus();
            setupInput();
            return;
        }
        const cmd = sequence[idx];
        typeAtPrompt(cmd, 38, () => {
            execCommand(cmd);
            const inp = document.getElementById('cmdInput');
            inp.disabled = true;
            inp.value = "";
            idx++;
            setTimeout(next, 380);
        });
    }

    setTimeout(next, 600);
}

function setupInput() {
    const input = document.getElementById('cmdInput');
    if (!input) return;
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            execCommand(input.value);
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (history.length) {
                histIdx = Math.max(0, histIdx - 1);
                input.value = history[histIdx] || "";
                setTimeout(()=> input.setSelectionRange(input.value.length, input.value.length), 0);
            }
        } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (histIdx < history.length - 1) {
                histIdx++;
                input.value = history[histIdx] || "";
            } else {
                histIdx = history.length;
                input.value = "";
            }
        } else if (e.key === 'Tab') {
            e.preventDefault();
            const val = input.value.trim();
            const parts = splitArgs(val);
            const last = parts[parts.length - 1] || "";
            const node = getNode(cwd);
            const candidates = Object.keys(node).filter(k => !k.startsWith("_") && k.toLowerCase().startsWith(last.toLowerCase()));
            if (candidates.length === 1) {
                const full = val.slice(0, val.lastIndexOf(last)) + candidates[0];
                input.value = full + (candidates[0].endsWith("/") ? "" : " ");
            } else if (candidates.length > 1) {
                addBlock(val, `<div class="ls">${candidates.map(c=>`<span class="item ${isDir(c)?'dir':'file'}">${c}</span>`).join(" ")}</div>`, true);
            }
        }
    });
    termBody.addEventListener('click', (e) => {
        if (e.target.closest('.item') || e.target.closest('a')) return;
        input.focus();
    });
    input.focus();
}

initDemo();
